<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #0f172a 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1a1a2e;
    }
    .login-card {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      text-align: center;
    }
    .login-card h1 { font-size: 24px; font-weight: 700; color: #1a3a6c; margin-bottom: 8px; }
    .login-card .subtitle { font-size: 14px; color: #64748b; margin-bottom: 32px; }
    .form-group { margin-bottom: 20px; text-align: left; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; color: #475569; margin-bottom: 6px; }
    .form-group input {
      width: 100%; padding: 12px 16px; border: 2px solid #e2e8f0; border-radius: 10px;
      font-size: 15px; font-family: inherit; transition: border-color 0.2s; outline: none;
    }
    .form-group input:focus { border-color: #1a3a6c; }
    .btn-login {
      width: 100%; padding: 14px; background: #1a3a6c; color: white; border: none;
      border-radius: 10px; font-size: 16px; font-weight: 600; font-family: inherit;
      cursor: pointer; transition: background 0.2s, transform 0.1s; margin-top: 8px;
    }
    .btn-login:hover { background: #0d2040; transform: translateY(-1px); }
    .btn-login:disabled { background: #94a3b8; cursor: not-allowed; transform: none; }
    .error-msg { color: #dc2626; font-size: 13px; margin-top: 12px; min-height: 20px; }
    .success-msg { color: #059669; font-size: 13px; margin-top: 12px; min-height: 20px; }
    .divider { display: flex; align-items: center; margin: 24px 0; gap: 12px; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #e2e8f0; }
    .divider span { font-size: 12px; color: #94a3b8; white-space: nowrap; }
    .btn-magic {
      width: 100%; padding: 14px; background: transparent; color: #1a3a6c;
      border: 2px solid #1a3a6c; border-radius: 10px; font-size: 15px; font-weight: 600;
      font-family: inherit; cursor: pointer; transition: all 0.2s;
    }
    .btn-magic:hover { background: #f0f7ff; }
    .btn-magic:disabled { border-color: #94a3b8; color: #94a3b8; cursor: not-allowed; }
    .tabs { display: flex; gap: 0; margin-bottom: 28px; border-radius: 10px; overflow: hidden; border: 2px solid #e2e8f0; }
    .tab-btn {
      flex: 1; padding: 10px; background: white; border: none; font-size: 14px;
      font-weight: 600; font-family: inherit; cursor: pointer; color: #64748b; transition: all 0.2s;
    }
    .tab-btn.active { background: #1a3a6c; color: white; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>🔐 Portfolio</h1>
    <p class="subtitle">출자 펀드 포트폴리오사 리스트</p>
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('password')">비밀번호 로그인</button>
      <button class="tab-btn" onclick="switchTab('magic')">메일 링크 로그인</button>
    </div>
    <div id="tab-password" class="tab-content active">
      <form onsubmit="loginWithPassword(event)">
        <div class="form-group"><label>이메일</label><input type="email" id="pw-email" placeholder="your@email.com" required></div>
        <div class="form-group"><label>비밀번호</label><input type="password" id="pw-password" placeholder="비밀번호 입력" required></div>
        <button type="submit" class="btn-login" id="btn-pw-login">로그인</button>
      </form>
    </div>
    <div id="tab-magic" class="tab-content">
      <form onsubmit="loginWithMagicLink(event)">
        <div class="form-group"><label>이메일</label><input type="email" id="magic-email" placeholder="your@email.com" required></div>
        <button type="submit" class="btn-magic" id="btn-magic">✉️ 로그인 링크 보내기</button>
      </form>
    </div>
    <p class="error-msg" id="error-msg"></p>
    <p class="success-msg" id="success-msg"></p>
  </div>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCPCJqFqIbXwQr7KzgGGxHE_ME",
      authDomain: "portfolio-44470.firebaseapp.com",
      projectId: "portfolio-44470",
      storageBucket: "portfolio-44470.firebasestorage.app",
      messagingSenderId: "1059977551878",
      appId: "1:1059977551878:web:51217f2fe72ca72e3de387"
    };
    const ALLOWED_EMAILS = ["a.jinan.kim@gmail.com","jinan@bsco.co.kr","jinan.kim@gmail.com","jinanz@bsco.co.kr"];
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    auth.onAuthStateChanged(user => { if (user) window.location.href = '/main.html'; });
    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      document.querySelector(`#tab-${tab}`).classList.add('active');
      event.target.classList.add('active');
      clearMessages();
    }
    function clearMessages() { document.getElementById('error-msg').textContent = ''; document.getElementById('success-msg').textContent = ''; }
    function showError(msg) { document.getElementById('error-msg').textContent = msg; document.getElementById('success-msg').textContent = ''; }
    function showSuccess(msg) { document.getElementById('success-msg').textContent = msg; document.getElementById('error-msg').textContent = ''; }
    function isAllowedEmail(email) { return ALLOWED_EMAILS.includes(email.toLowerCase().trim()); }
    async function loginWithPassword(e) {
      e.preventDefault(); clearMessages();
      const email = document.getElementById('pw-email').value.trim();
      const password = document.getElementById('pw-password').value;
      const btn = document.getElementById('btn-pw-login');
      if (!isAllowedEmail(email)) { showError('허용되지 않은 이메일입니다.'); return; }
      btn.disabled = true; btn.textContent = '로그인 중...';
      try {
        await auth.signInWithEmailAndPassword(email, password);
        window.location.href = '/main.html';
      } catch (err) {
        if (err.code === 'auth/user-not-found') {
          try { await auth.createUserWithEmailAndPassword(email, password); showSuccess('계정 생성 완료! 로그인 중...'); setTimeout(() => window.location.href = '/main.html', 1000); }
          catch (regErr) { showError('로그인 실패: 이메일과 비밀번호를 확인해주세요.'); }
        } else if (err.code === 'auth/wrong-password') { showError('비밀번호가 올바르지 않습니다.'); }
        else { showError('로그인 중 오류가 발생했습니다.'); }
      } finally { btn.disabled = false; btn.textContent = '로그인'; }
    }
    async function loginWithMagicLink(e) {
      e.preventDefault(); clearMessages();
      const email = document.getElementById('magic-email').value.trim();
      const btn = document.getElementById('btn-magic');
      if (!isAllowedEmail(email)) { showError('허용되지 않은 이메일입니다.'); return; }
      btn.disabled = true; btn.textContent = '전송 중...';
      try {
        await auth.sendSignInLinkToEmail(email, { url: window.location.origin + '/main.html', handleCodeInApp: true });
        window.localStorage.setItem('emailForSignIn', email);
        showSuccess('✅ 로그인 링크가 이메일로 전송되었습니다!');
      } catch (err) { showError('메일 전송 중 오류가 발생했습니다.'); }
      finally { btn.disabled = false; btn.textContent = '✉️ 로그인 링크 보내기'; }
    }
    if (auth.isSignInWithEmailLink(window.location.href)) {
      let email = window.localStorage.getItem('emailForSignIn');
      if (!email) email = window.prompt('이메일을 입력해주세요:');
      if (email) auth.signInWithEmailLink(email, window.location.href).then(() => { window.localStorage.removeItem('emailForSignIn'); window.location.href = '/main.html'; }).catch(() => showError('링크가 만료되었습니다.'));
    }
  </script>
</body>
</html>
